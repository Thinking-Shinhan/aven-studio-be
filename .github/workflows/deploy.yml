name: Deploy Spring Boot to GCP VM

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build Spring Boot jar
        run: ./gradlew clean bootJar -x test

      - name: Prepare deploy jar
        run: |
          mkdir -p deploy
          cp $(ls build/libs/*.jar | grep -v plain | head -n 1) deploy/app.jar
          jar tf deploy/app.jar | grep "BOOT-INF/classes/kr/co/daeun/avenstudiobe/global/config/SecurityConfig.class"

      - name: Copy jar to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "deploy/app.jar"
          target: "/tmp/aven-studio"
          strip_components: 1
          overwrite: true

      - name: Restart Spring Boot service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/aven-studio
            sudo cp /tmp/aven-studio/app.jar /opt/aven-studio/app.jar
            sudo systemctl restart aven-studio
            sudo systemctl status aven-studio --no-pager