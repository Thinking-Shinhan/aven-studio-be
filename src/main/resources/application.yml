spring:
    application:
        name: aven-studio-be

    datasource:
      url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          format_sql: true
      open-in-view: false
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24시간 (ms)