spring:
    application:
        name: aven-studio-be

    datasource:
      url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 3
        minimum-idle: 1
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 30000

    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          format_sql: true
      open-in-view: false

    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 50MB
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 86400000
  refresh-expiration: 604800000
gcp:
  storage:
    bucket: aven-studio-assets
sheet:
  sync:
    fixed-delay-ms: 3600000
google:
  sheets:
    enabled: ${GOOGLE_SHEETS_ENABLED:false}
  ai:
    api-key: ${GOOGLE_AI_API_KEY:}
    image-model: ${GOOGLE_AI_IMAGE_MODEL:gemini-2.5-flash-image}
    timeout-seconds: ${GOOGLE_AI_TIMEOUT_SECONDS:120}
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  max-tokens: 2048
  timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:20}
  brand-mood-timeout-seconds: ${ANTHROPIC_BRAND_MOOD_TIMEOUT_SECONDS:120}
  image-placement-timeout-seconds: ${ANTHROPIC_IMAGE_PLACEMENT_TIMEOUT_SECONDS:20}
  max-concurrent-requests: ${ANTHROPIC_MAX_CONCURRENT_REQUESTS:4}
  concurrency-wait-millis: ${ANTHROPIC_CONCURRENCY_WAIT_MILLIS:700}
  max-retries: ${ANTHROPIC_MAX_RETRIES:1}
  retry-delay-millis: ${ANTHROPIC_RETRY_DELAY_MILLIS:300}
  review-max-images: 12
  review-image-max-edge: 512
  review-image-timeout-seconds: 30
  review-max-issues: 30
  review-max-tokens: 8192
image-generation:
  gcs-save-enabled: ${IMAGE_GENERATION_GCS_SAVE_ENABLED:true}
  job-executor:
    core-size: ${IMAGE_GENERATION_JOB_CORE_SIZE:1}
    max-size: ${IMAGE_GENERATION_JOB_MAX_SIZE:2}
    queue-capacity: ${IMAGE_GENERATION_JOB_QUEUE_CAPACITY:20}
  task-executor:
    pool-size: ${IMAGE_GENERATION_TASK_POOL_SIZE:2}
    queue-capacity: ${IMAGE_GENERATION_TASK_QUEUE_CAPACITY:100}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
