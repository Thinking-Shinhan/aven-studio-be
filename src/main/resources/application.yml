spring:
    application:
        name: aven-studio-be

    datasource:
      url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 3
        minimum-idle: 1
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 30000

    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          format_sql: true
      open-in-view: false

    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 50MB
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 86400000
  refresh-expiration: 604800000
gcp:
  storage:
    bucket: aven-studio-assets
sheet:
  sync:
    fixed-delay-ms: 3600000
google:
  sheets:
    enabled: ${GOOGLE_SHEETS_ENABLED:false}
  ai:
    api-key: ${GOOGLE_AI_API_KEY:}
    image-model: ${GOOGLE_AI_IMAGE_MODEL:gemini-2.5-flash-image}
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
  max-tokens: 2048
  timeout-seconds: 30
image-generation:
  gcs-save-enabled: ${IMAGE_GENERATION_GCS_SAVE_ENABLED:true}
